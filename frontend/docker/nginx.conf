# Static SPA + same-origin API reverse proxy. BACKEND upstream is the compose service name.
upstream chennaiflood_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    gzip_min_length 2048;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://chennaiflood_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Simulation creation returns immediately; the longest synchronous calls are first-time product generation.
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    # Fingerprinted build assets and Cesium static assets can be cached aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /cesium/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
